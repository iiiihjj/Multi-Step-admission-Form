
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Registration Form</h1>
        <p class="subtitle">Please complete all steps</p>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="step-indicators">
            <span class="step-number active">1</span>
            <span class="step-number">2</span>
            <span class="step-number">3</span>
        </div>

        <form id="multiStepForm">

            <!-- Step 1: Personal Information -->
            <div class="form-step active">
                <h2>Personal Information</h2>

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <!-- Step 2: Additional Information -->
            <div class="form-step">
                <h2>Additional Information</h2>

                <label for="city">City</label>
                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter your city"
                    required
                >

                <label for="country">Country</label>
                <input
                    type="text"
                    id="country"
                    name="country"
                    placeholder="Enter your country"
                    required
                >

                <label for="occupation">Occupation</label>
                <input
                    type="text"
                    id="occupation"
                    name="occupation"
                    placeholder="Enter your occupation"
                    required
                >
            </div>

            <!-- Step 3: Final Summary -->
            <div class="form-step">
                <h2>Review Your Information</h2>

                <div id="summary" class="summary"></div>

                <p class="review-message">
                    Please check your information before submitting.
                </p>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="success-message" hidden>
                <h2>Registration Successful!</h2>
                <p>Your form has been submitted successfully.</p>
            </div>

            <!-- Navigation Buttons -->
            <div class="button-container" id="navigationButtons">
                <button type="button" id="prevBtn" class="prev-btn">
                    Previous
                </button>

                <button type="button" id="nextBtn" class="next-btn">
                    Next
                </button>

                <button type="submit" id="submitBtn" class="submit-btn" hidden>
                    Submit
                </button>
            </div>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
